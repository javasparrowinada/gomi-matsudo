const RECYCLE_ANCHOR = new Date(2026,3,1);

function recycleKind(d){
  if(d < RECYCLE_ANCHOR || d > RECYCLE_END) return null;
  const weeks = Math.round((d - RECYCLE_ANCHOR)/(7*86400000));
  return weeks % 2 === 0 ? "紙・布" : "ビン・缶";
}

function nextDate(days, want){
  if(!days) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  for(let i=0;i<30;i++){
    const d = new Date(t); d.setDate(t.getDate()+i);

    return {date:d, offset:i, kind:recycleKind(d)};
  }
  return null;
}

  return ESCALATORS.filter(e => e.detect.test(t));

/* 辞書の行き先が早見表の品目名そのもの（括弧書きまで同じ）なら、その行だけを使う。
   「電動(アシスト付)自転車」が同じ頭の「…専用バッテリー」まで拾わないようにする。 */
function synonymTarget(name){
  const full = DATA.filter(r => norm(r.item) === norm(name));
  return full.length ? full : search(name);
}
function synonymHits(word){
  const vs = variants(word).map(norm);
  // 完全一致を優先
  for(const v of vs){
    for(const k in SYNONYMS){
      if(norm(k) === v){
        const r = synonymTarget(SYNONYMS[k]);
        if(r.length) return r.map(x=>({r:x, why:`早見表の「${SYNONYMS[k]}」と同じ扱い`, from:SYNONYMS[k]}));
      }
    }
  }
  // 語尾・含有での一致（長い鍵を優先）
  const keys = Object.keys(SYNONYMS).sort((a,b)=>norm(b).length - norm(a).length);
  const w0 = norm(word);
  for(const k of keys){
    const nk = norm(k);
    if(nk.length < 2) continue;
    if(w0.endsWith(nk)){
      const r = synonymTarget(SYNONYMS[k]);
      if(r.length) return r.map(x=>({r:x, why:`早見表の「${SYNONYMS[k]}」と同じ扱い`, from:SYNONYMS[k]}));
    }
  }
  return [];
}


/* 入力から中心の語を取り出す。「自転車のライト」→「ライト」のように、
   修飾語が付いても早見表に届くようにする。 */
const PREFIX_DROP = /^(古い|新しい|使い古した|使わなくなった|壊れた|不要な|いらない|子供用の|子ども用の|子供の|子どもの|赤ちゃんの|大人用の|家庭用の|業務用の|うちの|家の|使い終わった|使い切った|使用済みの|使用済み|汚れた|割れた|欠けた|古くなった|こわれた|要らない)/;
function splitMulti(word){
  // 早見表にその名前の品目が実在するなら、区切り記号が入っていても分割しない
  // （「蛍光管、蛍光灯」「CD、MD、DVD」などは1つの品目名）
  if(searchExact(word).length) return null;
  const parts = word.split(/[とや、,，]|および|及び/).map(x=>x.trim()).filter(x=>x.length>=2);
  if(parts.length < 2) return null;
  // 分割した全部が早見表に当たるときだけ「複数」とみなす
  const allHit = parts.every(x => searchExact(x).length || searchPartial(x).length);
  return allHit ? parts : null;
}
function variants(word){
  const out = [];
  const push = v => { v = (v||"").trim(); if(v && !out.includes(v)) out.push(v); };
  push(word);
  let w = word.trim();
  let prev;
  do { prev = w; w = w.replace(PREFIX_DROP, "").trim(); push(w); } while(w !== prev && w);
  // 「Aの B」「A用の B」「A用B」→ B を後ろから順に
  const parts = w.split(/の(?=.)/);
  for(let i = 1; i < parts.length; i++) push(parts.slice(i).join("の"));
  const yo = w.split(/用(?=.)/);
  for(let i = 1; i < yo.length; i++) push(yo.slice(i).join("用"));
  // 最後の語だけ
  const last = w.split(/[のー・\s]/).filter(Boolean).pop();
  push(last);
  return out;
}

/* ========== APIが使えない環境での推定（文字の重なりで近い品目を探す） ========== */
function bigrams(t){ const a=[]; for(let i=0;i<t.length-1;i++) a.push(t.slice(i,i+2)); return a; }
function similarity(a,b){
  const A=bigrams(a), B=new Set(bigrams(b));
  if(!A.length) return 0;
  let hit=0; A.forEach(g=>{ if(B.has(g)) hit++; });
  return hit / A.length;
}
function localGuess(word){
  const syn = synonymHits(word);
  if(syn.length) return syn;
  const vs = variants(word).map(norm).filter(v => v.length >= 2);
  if(!vs.length) return [];
  const scored = DATA.map(r => {
    const base = norm(baseName(r.item));
    let sc = 0;
    vs.forEach(v => {
      sc = Math.max(sc, similarity(v, base), similarity(base, v));
      if(base.includes(v) || v.includes(base)) sc = Math.max(sc, 0.7);
    });
    return {r, sc};
  }).filter(x => x.sc >= 0.75);
  scored.sort((a,b) => b.sc - a.sc);
  const seen = new Set(), out = [];
  for(const x of scored){
    const b = baseName(x.r.item);
    if(out.length >= 6 && !seen.has(b)) break;
    if(seen.size >= 3 && !seen.has(b)) continue;
    seen.add(b); out.push({r:x.r, why:"名前が近い品目", from:b});
  }
  return out;
}

/* 品目名の条件部分を、実物を見て判断できる言い方に直す */
function condLabel(item){
  const m = item.match(/[(（]([^)）]*)[)）]/g);
  if(!m) return "";
  let t = m.map(x=>x.replace(/^[(（]|[)）]$/g,"")).join("・");
  t = t.replace(/センチメートル/g,"センチ").replace(/メートル/g,"m");
  let parts = t.split(/[・、,]/).map(x=>x.trim()).filter(Boolean);
  // 「金属製・プラスチック製」のように素材が2つ以上並ぶのは「どれでも同じ扱い」の意味。
  // 1つずつ言い換えると「金属が使われている／金属部品なし」と矛盾して見えるので、まとめて出す
  const mats = parts.filter(x => /^[^0-9]+製$/.test(x));
  if(mats.length >= 2){
    const at = parts.indexOf(mats[0]);
    parts = parts.filter(x => !mats.includes(x));
    parts.splice(at, 0, `${mats.join("・")}のどれでも同じ扱い`);
  }
  const out = [];
  parts.forEach(x=>{
    if(/^金属製$/.test(x))            out.push("一部でも金属が使われている");
    else if(/^プラスチック製$/.test(x)) out.push("全部プラスチック（金属部品なし）");
    else if(/^木製$/.test(x))          out.push("木でできている");
    else if(/^紙製$/.test(x))          out.push("紙でできている");
    else if(/^陶器製$|^陶磁器/.test(x)) out.push("陶器・焼き物");
    else if(/^ゴム製$/.test(x))        out.push("ゴム製");
    else if(/^本革製/.test(x))         out.push("本革");
    else if(/^合成皮革/.test(x))       out.push("合成皮革（フェイクレザー）");
    else if(/^ビニール製$/.test(x))    out.push("ビニール");
    else if(/どの素材でも/.test(x))     out.push("素材は問わない");
    else if(/^(\d+(?:\.\d+)?)(センチ|m|畳|キログラム)未満$/.test(x)){
      const r = x.match(/^(\d+(?:\.\d+)?)(センチ|m|畳|キログラム)未満$/);
      out.push(`一番長いところが${r[1]}${r[2]}より小さい`);
    }
    else if(/^(\d+(?:\.\d+)?)(センチ|m|畳|キログラム)以上$/.test(x)){
      const r = x.match(/^(\d+(?:\.\d+)?)(センチ|m|畳|キログラム)以上$/);
      out.push(`一番長いところが${r[1]}${r[2]}以上`);
    }
    else if(/(\d+(?:\.\d+)?)(センチ|m)以上(\d+(?:\.\d+)?)(センチ|m)未満/.test(x)){
      const r = x.match(/(\d+(?:\.\d+)?)(センチ|m)以上(\d+(?:\.\d+)?)(センチ|m)未満/);
      out.push(`一番長いところが${r[1]}〜${r[3]}${r[4]}`);
    }
    else out.push(x);
  });
  return out.join(" ／ ");
}
function hasMetalWord(item){ return /金属製/.test(item); }

const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function searchExact(word){
  const w = norm(word);
  if(!w) return [];
  return DATA.filter(r => norm(baseName(r.item)) === w);
}
function searchPartial(word){
  const w = norm(word);
  if(!w) return [];
  return DATA.filter(r => norm(r.item).includes(w) || w.includes(norm(baseName(r.item))));
}
function search(word){
  const e = searchExact(word);
  return e.length ? e : searchPartial(word);
}

function searchWide(word){
  const vs = variants(word);
  for(const v of vs){ const h = searchExact(v); if(h.length) return h; }
  return [];
}
/* 入力そのものが言い換え辞書の呼び名で、早見表にまったく同じ表記の品目がないときは true。
   「アルミホイル」が表記ゆれで「アルミホイール(車用)」に、
   「掃除機の紙パック」が語尾だけで「紙パック」に当たるのを防ぐ。
   「バッテリー」「バット」のように早見表に同じ表記があるものは従来どおり早見表を先に使う。 */
function synonymFirst(word){
  const k = Object.keys(SYNONYMS).find(k => norm(k) === norm(word));
  if(!k || norm(SYNONYMS[k]) === norm(k)) return false;
  return !DATA.some(r => baseName(r.item) === word.trim());
}
function render(word){
  // 0. 「AとB」は分けて出す
  const multi = splitMulti(word);
  if(multi){ return renderMulti(word, multi); }
  // 1. 早見表に同じ名前がある（入力そのものが言い換え辞書にあり、早見表に同じ表記がなければ辞書を先に使う）
  const hits = synonymFirst(word) ? [] : searchWide(word);
  if(hits.length){
    if(hits.length === 1 && !hits[0].cat.includes("/")){ renderVerdict(hits[0]); return; }
    renderChoices(word, hits); return;
  }
  // 2. 言い換え辞書
  const syn = synonymHits(word);
  if(syn.length){
    const escs = escalatorsFor(word, syn.map(x=>x.r.note).join(" "));
    if(syn.length === 1 && !syn[0].r.cat.includes("/")){
      renderVerdict(syn[0].r, {word, why:syn[0].why, from:syn[0].from}); return;
    }
    renderGuessChoices(word, syn, true, "", "", escs); return;
  }
  // 3. 部分一致（名前の一部が早見表にある）
  let part = [];
  for(const v of variants(word)){
    if(norm(v).length < 3) continue;       // 「あ」「い」等では部分一致を使わない
    part = searchPartial(v);
    if(part.length > 8){ part = []; continue; }  // 広すぎる一致は信用しない
    if(part.length) break;
  }
  if(part.length){
    const rows = part.slice(0,6).map(r=>({r, why:"名前の一部が一致", from:baseName(r.item)}));
    const escs = escalatorsFor(word, part.map(r=>r.note).join(" "));
    renderGuessChoices(word, rows, true, "", "", escs); return;
  }
  // 4. 推定
  return guess(word);
}

/* 「AとB」は、それぞれの結果を続けて1ページに出す（タップで切り替えない） */
async function renderMulti(word, parts){

}

/* 次の収集日を n 回分（資源ごみの隔週は同じ回だけ） */
function nextDates(s, n){
  const list = [];
  if(!s || !s.days) return list;
  const t = new Date(); t.setHours(0,0,0,0);
  for(let i=0; i<60 && list.length<n; i++){
    const d = new Date(t); d.setDate(t.getDate()+i);
    if(!s.days.includes(d.getDay())) continue;
    if(s.recycle && s.recycle !== "both"){
      const k = recycleKind(d);
      if(k === null){ list.push({date:d, offset:i, unsure:true}); break; }
      if(k !== s.recycle) continue;
    }
    list.push({date:d, offset:i, kind:recycleKind(d)});
  }
  return list;
}
function fmtDate(x){
  const when = x.offset===0 ? "今日" : x.offset===1 ? "明日" : `${x.offset}日後`;
  return `${x.date.getMonth()+1}月${x.date.getDate()}日（${WD[x.date.getDay()]}）${when}`;
}
function dayBlock(main, compact){
  const s = SCHED[main] || SCHED[main.replace(/。$/,"")] || null;
  if(!s) return `<div class="dow">出す曜日：判定できません</div><div class="caution">コールセンター（0120-264-057）で確認してください。</div>`;
  if(!s.days) return `<div class="dow">${esc(s.label)}</div>${s.warn ? `<div class="caution">${esc(s.warn)}</div>` : ""}`;
  const alt = s.recycle && s.recycle !== "both";
  const days = s.days.map(i => WD[i]).join("・");
  const head = alt ? `${days}曜日（隔週・${s.recycle}の回）` : `毎週 ${days}曜日`;
  const strip = `<div class="week">${WD.map((w,i)=>`<span class="${s.days.includes(i) ? "on" : ""}">${w}</span>`).join("")}</div>`;
  const nd = nextDates(s, 2);
  let next = "";
  if(nd.length && nd[0].unsure){
    next = `<div class="caution">資源ごみは紙・布とビン・缶の隔週です。この日付は市のカレンダー収録期間外のため、市の資源ごみカレンダーで確認してください。</div>`;
  } else if(nd.length){
    next = `<div class="next">次は <b>${fmtDate(nd[0])}</b>${!compact && nd[1] && !nd[1].unsure ? `<br>その次は ${fmtDate(nd[1])}` : ""}</div>`;
  }
  if(compact) return `<div class="dow">${esc(head)}</div>${strip}${next}${alt ? `<div class="caution">紙・布とビン・缶の隔週です。</div>` : ""}${s.warn ? `<div class="caution">${esc(s.warn)}</div>` : ""}`;
  let extra = "朝8時30分までに集積所へ。";
  if(alt){
    extra = `資源ごみは紙・布とビン・缶の隔週です。${esc(s.recycle)}の回の水曜日だけ出せます。` + extra;
  } else if(s.days.includes(3)){
    const k = nd[0] && nd[0].kind;
    extra = `水曜は不燃ごみ・有害ごみ・資源ごみが同じ日です。${k ? `次の水曜の資源ごみは「${esc(k)}」の回。` : ""}` + extra;
  }
  return `<div class="dow">${esc(head)}</div>${strip}${next}<div class="caution">${extra}</div>${s.warn ? `<div class="caution">${esc(s.warn)}</div>` : ""}`;
}
/* 袋に貼る紙。早見表の備考に「〇〇」と明記／貼り紙 の指定があるときだけ「松戸市の指定」として出す。
   指定がない品目に、推測で文字を書かせない。 */
function paperBlock(r, generalOnly){
  // generalOnly：場合分けで出すときは、区分名を含まない文（品目全体に当てはまる指示）だけを使う
  const note = generalOnly
    ? (r.note || "").split("。").filter(x => !noteCases(x).length).join("。")
    : (r.note || "");
  const main = r.cat.split("/")[0].trim();
  const s = SCHED[main] || SCHED[main.replace(/。$/,"")] || null;
  const told = [];
  const re = /「([^」]{1,20})」\s*と(明記|貼り紙)/g;
  let m;
  while((m = re.exec(note)) !== null){ if(!told.includes(m[1])) told.push(m[1]); }
  if(/新聞紙等で(包み|くるみ)/.test(note) && !told.includes("危険")) told.push("危険");
  if(generalOnly && !told.length) return "";
  if(told.length){
    const said = note.split("。").filter(x => /明記|貼り紙|新聞紙等で(包み|くるみ)/.test(x)).map(x => x + "。").join("");
    return `<div class="paper">
      <div class="ph">袋に貼る紙に書く文字（松戸市の指定）</div>

      <div class="pn">紙に大きく書いて袋に貼るか、袋に直接書きます。<br>市の記載：${esc(said)}</div>
    </div>`;
  }
  if(!s || !s.days) return "";   // 集積所に出さないものは貼り紙の対象外
  return `<div class="paper none">
    <div class="ph">袋に貼る紙</div>

  </div>`;
}
/* ========== 備考を「場合 → 区分」に分ける ==========
   早見表の備考は「50センチメートル未満は「不燃ごみ」に出してください」のような文の集まり。
   区分名（SCHED にある名前）を「」で含む文を、場合ごとに1件ずつ取り出す。区分は必ず備考の文字どおり。 */
function catName(x){
  if(SCHED[x]) return x;
  const y = x.replace(/。$/,"");
  return SCHED[y] ? y : null;
}
function noteCases(note){
  const cases = [];
  (note||"").split("。").map(s => s.trim()).filter(Boolean).forEach(sent => {
    const battery = /電池|バッテリー/.test(sent);
    // 区分名は「」付きが基本。「50センチメートル未満の本体は不燃ごみに出してください」のような「」なしも拾う
    const bare = Object.keys(SCHED).filter(k => !/^※/.test(k)).sort((a,b) => b.length - a.length).map(k => k.replace(/[()（）]/g, "\\$&")).join("|");
    const segs = [...sent.matchAll(new RegExp(`「([^」]+)」|(${bare})(?=(に|で|へ|として)出)`, "g"))]
      .map(m => { m[1] = m[1] || m[2]; return m; })
      .filter(m => catName(m[1]));
    let start = 0, head = "";
    segs.forEach((m, i) => {
      // 「50センチ未満は「A」、50センチ以上は「B」に出す」は、読点で2つの場合に分ける
      const after = m.index + m[0].length;
      const comma = sent.indexOf("、", after);
      const last = i + 1 >= segs.length;
      const next = last ? sent.length : ((comma !== -1 && comma < segs[i+1].index) ? comma + 1 : after);
      const piece = sent.slice(start, next);
      let label = sent.slice(start, m.index).replace(/^[、\s]+/, "").trim();
      if(i === 0){ const h = label.match(/^(.*?もので)/); head = h ? h[1] : ""; }
      else if(head && !label.startsWith(head)) label = head + label;
      // 「取り外しできるものは小型充電式電池を…ポリ袋に」のように長いときは「〜ものは」までを見出しにする
      const q = label.indexOf("「"), ha = label.search(/(もの|場合)は/);
      if(ha > 0 && (q === -1 || ha < q)) label = label.slice(0, label.indexOf("は", ha) + 1);
      label = label.replace(/[は、]+$/, "").replace(/センチメートル/g, "センチ").replace(/メートル/g, "m");
      const signs = [...piece.matchAll(/「([^」]{1,20})」\s*と(明記|貼り紙)/g)].map(x => x[1]);
      cases.push({label: label || "この品目", cat: catName(m[1]), signs, battery, said: sent + "。"});
      start = next;
    });
  });
  return cases;
}
/* 区分・曜日・貼り紙。条件で区分が分かれる品目は、場合ごとに並べる（電池の有無で見出しを分ける） */
function howBlock(r, bigClass){
  const cats = r.cat.split("/").map(x => x.trim());
  const main = cats[0];
  const cs = noteCases(r.note);
  const useCases = cs.length && (cats.length > 1 || cs.some(c => c.cat !== catName(main)));
  if(!useCases){
    return `<div class="${bigClass}">${esc(main.replace(/^※/,""))}</div>
      ${cats.length > 1 ? `<div class="caution">区分の表記：${esc(r.cat)}（条件で変わります。下の備考を確認してください）</div>` : ""}
      ${dayBlock(main)}
      ${paperBlock(r)}`;
  }
  // 早見表の分別区分のうち、備考のどの場合にも出てこない区分は「上に当てはまらない場合」として最後に置く（区分を落とさない）
  const sameCat = (a, b) => a === b || a.startsWith(b) || b.startsWith(a);   // 「資源ごみ」と「資源ごみ(紙類・布類)」は同じ
  // 備考の「資源ごみ」は、早見表の分別区分に「資源ごみ(紙類・布類)」があればそちらで出す（隔週の回まで分かるように）
  cs.forEach(x => { const full = cats.map(c => catName(c) || c).find(c => c.length > x.cat.length && c.startsWith(x.cat)); if(full) x.cat = full; });
  const left = cats.filter(c => !cs.some(x => sameCat(x.cat, catName(c) || c)));
  left.forEach(c => cs.push({
    label: left.length === 1 ? "上に当てはまらない場合（早見表の分別区分）" : `上に当てはまらない場合（早見表の分別区分は「${r.cat}」。どれになるかは備考を確認）`,
    cat: catName(c) || c, signs: [], battery: false, said: ""}));
  const caseHtml = c => `<div class="case">
      <div class="cl">${esc(c.label)}</div>
      <div class="ccat">→ ${esc(c.cat.replace(/^※/,""))}</div>
      ${dayBlock(c.cat, true)}
      ${c.signs.length ? `<div class="paper"><div class="ph">袋に貼る紙に書く文字（松戸市の指定）</div><div class="pw">${c.signs.map(esc).join("<br>")}</div><div class="pn">市の記載：${esc(c.said)}</div></div>` : ""}
    </div>`;
  const bat = cs.filter(c => c.battery), plain = cs.filter(c => !c.battery);
  let body = "";
  if(bat.length){
    body += `<div class="ch">電池が入っていない場合（電池を抜いた後の本体も）</div>`
      + (plain.length ? plain.map(caseHtml).join("") : `<div class="case"><div class="cl">早見表に、電池がない場合の記載はありません。コールセンター（0120-264-057）で確認してください。</div></div>`);
    body += `<div class="ch">電池が入っている場合</div>` + bat.map(caseHtml).join("");
  } else {
    body += `<div class="ch">当てはまる場合を見てください</div>` + plain.map(caseHtml).join("");
  }
  const anySign = cs.some(c => c.signs.length);
  const general = paperBlock(r, true);
  const s = SCHED[main] || SCHED[main.replace(/。$/,"")] || null;
  const none = !anySign && !general && s && s.days
    ? `<div class="paper none"><div class="ph">袋に貼る紙</div><div class="pn">早見表には、この品目で紙に書く文字の指定はありません。区分と曜日を守って集積所に出します。</div></div>` : "";
  const names = [...new Set(cs.map(c => c.cat.replace(/^※/,"")))];
  return `<div class="${bigClass}">条件で分かれます</div>
    <div class="caution">${esc(names.join("・"))}</div>
    ${body}
    ${general}${none}`;
}

/* 電池の確認は常に出す。早見表に「小型充電式電池内蔵製品（50センチメートル未満）＝有害ごみ」
   という一般ルールの行があり、品目名が載っているかどうかに関係なく当てはまるため。
   備考が空欄の行（カメラ、ビデオデッキなど）でも見落とさないようにする。 */
const ALWAYS_BATTERY = {

  verdict:"入っていれば有害ごみ",

};
function escBlock(escs, always){
  const list = [];
  if(always !== false) list.push(ALWAYS_BATTERY);
  (escs||[]).forEach(e => { if(e.id !== "battery") list.push(e); });
  if(!list.length) return "";
  return `<div class="esc">
    <div class="esch">先に確認してください。当てはまるものがあれば、素材や大きさより優先します。</div>
    ${list.map(e=>`<div class="escr"><b>${esc(e.ask)}</b><br>${e.verdict?`→ <b>${esc(e.verdict)}</b>　`:""}${esc(e.say)}</div>`).join("")}
  </div>`;
}

function renderChoices(word, hits){
  const list = sortMetalFirst(hits, x=>x.item);
  const escs = escalatorsFor(word, hits.map(h=>h.note).join(" "));
  out.innerHTML = `<div class="card">
    <div class="pick">「${esc(word)}」は、実物の素材と大きさで出す日が変わります。下に全部並べました。実物に当てはまるものを見てください。</div>
    ${escBlock(escs, !list.every(h => /電池/.test(h.note||"")))}
    <div class="assume">金属は一部でも入っていれば金属製として扱います。ネジ・バネ・軸・金具・芯線も金属です。</div>
    ${list.map(h=>candBlock(h)).join("")}
  </div>`;
}

async function guess(word){
  const syn = synonymHits(word);
  if(syn.length){
    const escs = escalatorsFor(word, syn.map(x=>x.r.note).join(" "));
    if(syn.length === 1 && !syn[0].r.cat.includes("/") && !escs.length){
      renderVerdict(syn[0].r, {word, why:syn[0].why, from:syn[0].from}); return;
    }
    renderGuessChoices(word, syn, true, "", "", escs); return;
  }
  out.innerHTML = `<div class="card"><div class="busy">「${esc(word)}」は早見表に同じ名前がありません。近い品目を探しています…</div></div>`;
  const names = [...new Set(DATA.map(r=>baseName(r.item)))];
  const prompt = `松戸市のごみ分別早見表に載っている品目名のリストを渡します。
リスト：${names.join("、")}

ユーザーが捨てたいものは「${word}」です。
これと同じ物、または材質・大きさ・用途がほぼ同じでごみの区分が同じになるとみなせる品目を、リストの中から選んでください。

判断のしかた（松戸市の早見表に実際に書かれている扱い）：
- ものは単一素材とはかぎらない。金具・軸・ネジ・バネ・芯材など、外から見えにくい金属部品も含めて全体で考えること。
- 早見表では、金属が中に入っていて取り外せないものは不燃ごみ側に寄せている。例：クリスマスツリー（プラスチック製）の備考「芯にワイヤー等金属を使うものは『不燃ごみ』に出してください」、アルバム（紙製）の備考「金属部分は取り外して『不燃ごみ』に出してください」。
- したがって、金属部品が構造上不可欠なものを、プラスチック製の品目に寄せてはいけない。

さらに、区分は素材だけで決まらない。次も必ず答えること。
- maybeBattery：乾電池・ボタン電池・充電池を内蔵している可能性があるなら true
- maybeBoard：基板・モーター・電源コードを含み電気で動く可能性があるなら true
- maybeBlade：刃物や先のとがった部分があるなら true
- maybeFuron：冷やす機能があり冷媒（フロン類）を使う可能性があるなら true
いずれも、その品物の一般的な製品にそれが入りうるなら true。迷ったら true。

hasMetal の判定（必ず答えること）：
ネジ・バネ・軸・受け・金具・芯線・刃・電池端子など、<b>ごく一部でも金属を含み</b>、かつ手で簡単に外せないなら true。外から見えなくても中に入っていれば true。迷ったら true にすること。

条件：
- リストにある語だけを返す。リストにない語は返さない。
- 該当が思い当たらない場合、または区分が変わりうる場合は空の配列を返す。無理に埋めない。
- 最大3つ、確からしい順。
- 出力は次の形のJSONのみ。説明文やマークダウンは書かない。
{"hasMetal":true または false,"metalWhy":"金属部品を20字以内で具体的に。無ければ空文字","maybeBattery":true または false,"maybeBoard":true または false,"maybeBlade":true または false,"maybeFuron":true または false,"assumption":"判断に使った前提を30字以内","candidates":[{"name":"リストの品目名","why":"なぜ同じ扱いとみなせるかを20字以内"}]}`;

/* hasMetal の判定基準（プロンプト内で指示済み）:
   ネジ・バネ・軸・金具・芯線・刃・電池端子など、一部でも金属を含み、
   かつ道具なしで外せないなら true。*/
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:prompt}]})
    });
    const data = await resp.json();
    const text = data.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
    let cands = [], assumption = "", hasMetal = false, metalWhy = "", flags = {};
    try{ const j = JSON.parse(text); cands = j.candidates||[]; assumption = j.assumption||""; hasMetal = !!j.hasMetal; metalWhy = j.metalWhy||"";
         flags = {battery:!!j.maybeBattery, board:!!j.maybeBoard, blade:!!j.maybeBlade, furon:!!j.maybeFuron}; }catch(_){ cands = []; }
    const esc2 = ESCALATORS.filter(e => flags[e.id]);
    let rows = [];
    cands.forEach(c => search(c.name).forEach(r => { if(!rows.find(x=>x.r===r)) rows.push({r, why:c.why, from:c.name, assumption}); }));

    /* 一部でも金属を含むなら、非金属素材と明記された品目は候補から外す。
       市の備考「芯にワイヤー等金属を使うものは不燃ごみ」の扱いに合わせる。 */
    if(hasMetal && rows.length){
      const nonMetal = /(プラスチック製|ビニール製|木製|紙製|布|本革製|合成皮革|竹製|天然素材|陶器製|ゴム製)/;
      const kept = rows.filter(x => !nonMetal.test(x.r.item));
      if(kept.length) rows = kept;
      rows.forEach(x => x.metal = metalWhy || "金属部品を含む");
    }
    if(rows.length === 0){ offlineGuess(word); return; }
    const cats = new Set(rows.map(x => x.r.cat.split("/")[0].trim()));
    const splits = rows.some(x => x.r.cat.includes("/"));
    if(esc2.length){ renderGuessChoices(word, rows, true, assumption, rows[0] && rows[0].metal, esc2); return; }
    if(rows.length === 1 && !splits){ renderVerdict(rows[0].r, {word, why:rows[0].why, from:rows[0].from, assumption, metal:rows[0].metal}); return; }
    renderGuessChoices(word, rows, cats.size > 1 || splits, assumption, rows[0] && rows[0].metal, esc2);
  }catch(err){ offlineGuess(word); }
}

/* APIが使えないとき（保存したファイル・自前のサーバーなど）はこちらで推定する */
function offlineGuess(word){
  const rows = localGuess(word);
  if(rows.length === 0){ renderUnknown(word); return; }
  const escs = escalatorsFor(word, rows.map(x=>x.r.note).join(" "));
  renderGuessChoices(word, rows, true, "", "", escs);
}

function renderGuessChoices(word, rows, splitCats, assumption, metal, escs){
  const list = sortMetalFirst(rows, x=>x.r.item);
  const head = splitCats
    ? `「${esc(word)}」は早見表に同じ名前がなく、<b>候補によって区分が変わります</b>。ここでは1つに決めません。下に全部並べました。実物に当てはまるものを見てください。`
    : `「${esc(word)}」は早見表に同じ名前がありません。近い品目から探しました。下に全部並べました。実物に当てはまるものを見てください。`;
  out.innerHTML = `<div class="card">
    <div class="pick">${head}</div>
    ${escBlock(escs, !list.every(x => /電池/.test(x.r.note||"")))}
    <div class="assume">金属は一部でも入っていれば金属製として扱います。ネジ・バネ・軸・金具・芯線も金属です。</div>
    ${metal ? `<div class="assume"><b>金属を含むものとして扱いました</b>（${esc(metal)}）。一部でも金属が入っていれば、見た目がプラスチックでも不燃ごみ側です。金属がまったく入っていない場合は、この候補は当てはまりません。</div>` : ""}
    ${assumption ? `<div class="assume">判断に使った前提：${esc(assumption)}　違っていればこの前提を読み替えてください</div>` : ""}
    ${list.map(x=>candBlock(x.r, x.why)).join("")}
  </div>`;
}

function renderUnknown(word){
  out.innerHTML = `<div class="card">
    <div class="unknown">「${esc(word)}」は早見表にありません。</div>
    <p class="caution">推測で出すと回収されない可能性があります。市に直接確認してください。収録済みの頭文字は限られています。未収録の行のものは必ずここに来ます。</p>
    <div class="tel"><a href="tel:0120264057">0120-264-057</a></div>
    <p class="caution">松戸市家庭ごみ相談コールセンター</p>
  </div>`;
}

function renderVerdict(r, g){
  const cats = r.cat.split("/").map(s=>s.trim());
  const main = cats[0];

  const otherCats = cats.length>1
    ? `<dt>区分の表記</dt><dd>${esc(r.cat)}（条件で変わります。下の記載を確認してください）</dd>` : "";

  const badge = g
    ? `<div class="level guess">推定　早見表に「${esc(g.word)}」の記載はありません</div>`
    : `<div class="level fixed">確定　早見表に記載があります</div>`;
  const guessNote = g
    ? `<div class="card quiet" style="margin-top:16px">
         <div class="caution">「${esc(g.word)}」を、早見表の「${esc(r.item)}」と同じ扱いとみなしました。${g.why?"理由："+esc(g.why)+"。":""}${g.metal?"<br><b>金属を含むものとして扱いました（"+esc(g.metal)+"）。</b>一部でも金属が入っていれば、見た目がプラスチックでも不燃ごみ側です。":""}${g.assumption?"<br>判断に使った前提："+esc(g.assumption)+"　この前提が違えば区分も変わります。":""}
         大きさで区分が変わります。違うと感じたらコールセンター（0120-264-057）で確認してください。</div>
       </div>` : "";
  out.innerHTML = `
  <div class="card">
    ${badge}
    ${howBlock(r, "verdict")}

    ${guessNote}
    ${escBlock(escalatorsFor(r.item, r.note), !/電池/.test(r.note||""))}
    <h2>根拠（松戸市の記載そのまま）</h2>
    <dl>
      <dt>品目例</dt><dd>${esc(r.item)}</dd>
      <dt>分別区分</dt><dd>${esc(r.cat)}</dd>
      ${otherCats}
      <dt>備考</dt><dd>${r.note ? esc(r.note) : "（記載なし）"}</dd>
    </dl>
    <div class="src">出典：松戸市 家庭ごみの分別早見表「${esc(r.page)}」<br><a href="${r.src}" target="_blank" rel="noopener">${r.src}</a></div>
  </div>`;
}

/* ========== 入力 ========== */
document.getElementById('go').onclick = () => render(document.getElementById('q').value.trim());
document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('go').click(); });
document.getElementById('cam').onclick = () => document.getElementById('file').click();

document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  out.innerHTML = `<div class="card"><div class="busy">写真から品目名を読み取っています…</div><img class="thumb" src="${url}" alt=""></div>`;

  let b64, mime = f.type || "image/jpeg";
  try{
    b64 = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(",")[1]);
      r.onerror= ()=>rej(new Error("読み込み失敗"));
      r.readAsDataURL(f);
    });
  }catch(err){ out.innerHTML = `<div class="card"><div class="unknown">写真を読み込めませんでした。もう一度選んでください。</div></div>`; return; }

  const names = [...new Set(DATA.map(r=>baseName(r.item)))];
  const prompt = `写真に写っている捨てたい物が、次のリストのどれに当たるかを判定してください。
リスト：${names.join("、")}

条件：
- リストにある語だけを返す。リストにない語は返さない。
- ネジ・バネ・軸・金具・芯線など一部でも金属を含むものは、プラスチック製・木製と書かれた品目に寄せないこと。
- どれにも当たらない、または判断できない場合は空の配列を返す。
- 迷う場合は候補を最大3つまで、確からしい順に返す。
- 出力はJSON配列のみ。説明文やマークダウンは一切書かない。
例：["アイロン"]`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:mime,data:b64}},
          {type:"text",text:prompt}
        ]}]
      })
    });
    const data = await resp.json();
    const text = data.content.filter(i=>i.type==="text").map(i=>i.text).join("").replace(/```json|```/g,"").trim();
    let cands = [];
    try{ cands = JSON.parse(text); }catch(_){ cands = []; }
    if(!Array.isArray(cands) || cands.length===0){
      out.innerHTML = `<div class="card">
        <div class="unknown">写真からは品目を特定できませんでした。</div>
        <p class="caution">名前が分かるなら上の欄に入力してください。分からなければ市に確認してください。</p>
        <div class="tel"><a href="tel:0120264057">0120-264-057</a></div>
        <img class="thumb" src="${url}" alt="">
      </div>`;
      return;
    }
    const rows = [];
    cands.forEach(c => search(c).forEach(r => { if(!rows.includes(r)) rows.push(r); }));
    if(rows.length===0){ renderUnknown(cands[0]); return; }
    if(rows.length===1){ renderVerdict(rows[0]); return; }
    renderChoices(cands.join("・"), rows);
  }catch(err){
    out.innerHTML = `<div class="card"><div class="unknown">写真からは判定できません。</div><p class="caution">この端末では写真の読み取りが使えません。品目名を上の欄に入力してください。1,048品目ぶんの判定はそのまま動きます。</p></div>`;
  }
};
</script>
